<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claugineer</title>
<style>
:root{
  --bg:#0f1214; --panel:#171b1f; --panel2:#1e2328; --line:#2a3138; --text:#e6e9ec; --dim:#8b949e;
  --accent:#ff7a1a; --good:#39d98a; --bad:#ff5c5c; --warn:#ffc53d; --a:#35c7ff; --b:#ffab7a;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;letter-spacing:.06em}
header h1 b{color:var(--accent)}
select,button,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;font:inherit}
button{cursor:pointer} button:hover{border-color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
main{padding:16px;max-width:1900px;margin:0 auto}
main>.card,main>.grid,main>.cmpgrid{margin-top:12px}
.sticky{position:sticky;top:52px;z-index:4;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.cmpgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.cmpgrid .side{position:sticky;top:150px;display:grid;gap:12px}
@media(max-width:1100px){.cmpgrid{grid-template-columns:1fr}.cmpgrid .side{position:static}}
.zcard{padding:8px 10px;margin-bottom:10px}
.zc canvas{cursor:crosshair;user-select:none}
.zct{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px 4px;font-weight:600}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.plab{width:110px;color:var(--dim);font-size:13px}
.chip{font:13px var(--mono);padding:4px 8px;border-radius:7px}
.chip.inv{opacity:.55;font-style:italic} .chip.pb{border-color:var(--good)} .chip.pit{opacity:.4}
.lapbadge{display:inline-flex;gap:6px;align-items:center;border:2px solid;border-radius:8px;padding:4px 10px;font:14px var(--mono)}
.lapbadge i,.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:middle}
#sess{max-width:min(100%,900px);text-overflow:ellipsis}
.zbtn{font-weight:600} .zbtn.on{background:#ffc53d;color:#111;border-color:#ffc53d}
table.ro td,table.ro th{padding:3px 6px;font:13px var(--mono)}
table.ct td{font-size:13px} tr.clk{cursor:pointer} tr.clk:hover td{background:var(--panel2)}
.habits{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px 18px}
.hab{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}
.hbar{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:6px}.hbar i{display:block;height:100%}
table.mx td,table.mx th{text-align:center;font-size:13px} table.mx td:first-child,table.mx th:first-child{text-align:left}
td.mxc{cursor:pointer;font-family:var(--mono)}
#lmap{cursor:grab}
.lmwrap{position:relative}.lmbtn{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.lmbtn button{width:34px;height:34px;font-size:18px;font-weight:700;padding:0;background:rgba(30,35,40,.9)}
.lmhelp{position:absolute;bottom:6px;right:10px;font-size:12px;color:var(--dim);background:rgba(15,18,20,.7);padding:2px 6px;border-radius:4px}
.notepop{position:fixed;z-index:50;width:370px;background:#1e2328;border:2px solid #c792ff;border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:grid;gap:8px}
.notepop textarea{width:100%;background:#0f1214;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit}
.notepop .qk{display:flex;flex-wrap:wrap;gap:4px}.notepop .qk button{font-size:12px;padding:2px 7px}
.notepop .pri{background:#c792ff;color:#111;border-color:#c792ff;font-weight:600}
.note{border-left:3px solid #c792ff;padding:6px 8px;margin:6px 0;background:var(--panel2);border-radius:4px}
.note.resolved{border-left-color:var(--good);opacity:.8} .clk{cursor:pointer} .tip{min-height:22px;margin-top:4px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.big{font:600 28px var(--mono)}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--dim);font-weight:600;position:sticky;top:0;background:var(--panel)}
td:first-child,th:first-child{text-align:left}
tr.out td{opacity:.45} tr.best td{color:var(--good)}
.tablewrap{overflow:auto;max-height:520px}
canvas{width:100%;display:block}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.improving{color:var(--good);border-color:var(--good)} .pill.losing{color:var(--bad);border-color:var(--bad)}
.pill.flat{color:var(--dim)}
.corner{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1.2fr);gap:14px}
@media(max-width:800px){.corner{grid-template-columns:1fr}}
ul{margin:4px 0;padding-left:18px} li{margin:2px 0}
.issue{color:var(--warn)}
.rec{border-left:3px solid var(--accent);padding:6px 10px;margin:8px 0;background:var(--panel2);border-radius:4px}
.rec b{color:var(--accent)}
.tyre{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tw{background:var(--panel2);border-radius:8px;padding:8px;text-align:center}
.tw .io{display:flex;justify-content:space-between;font:12px var(--mono)}
.hidden{display:none}
.legend span{margin-right:12px;font-size:12px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>CLAU<b>GINEER</b></h1>
  <select id="sess"></select>
  <nav id="tabs"></nav>
  <span id="stat" class="dim" style="margin-left:auto"></span>
</header>
<main id="main"></main>

<script>
const TABS=["Live","Session","Compare","Habits","Corners","Technique","Setup"];
let tab=localStorage.getItem("tab")||"Session", A=null, SID=null, liveTimer=null;
const $=s=>document.querySelector(s);
const fmt=t=>{if(t==null||t<=0)return"-";const m=Math.floor(t/60);return m+":"+(t-60*m).toFixed(3).padStart(6,"0")};
const f=(x,n=2)=>x==null?"-":Number(x).toFixed(n);
const sgn=(x,n=3)=>x==null?"-":(x>0?"+":"")+Number(x).toFixed(n);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
async function J(u,opt){const r=await fetch(u,opt);return r.json()}
function post(u,b){return J(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})}

// ------------------------------------------------------------- tiny chart
function chart(cv,o){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=o.h||180;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
  const c=cv.getContext("2d");c.scale(dpr,dpr);
  const pl=48,pr=10,pt=10,pb=22,w=W-pl-pr,h=H-pt-pb;
  let xs=o.x, ymin=Infinity,ymax=-Infinity;
  o.series.forEach(s=>s.y.forEach(v=>{if(v!=null&&isFinite(v)){ymin=Math.min(ymin,v);ymax=Math.max(ymax,v)}}));
  if(o.ymin!=null)ymin=o.ymin; if(o.ymax!=null)ymax=o.ymax;
  if(!isFinite(ymin)){return}
  if(ymax===ymin){ymax+=1;ymin-=1}
  const pad=(ymax-ymin)*0.06;ymin-=o.ymin!=null?0:pad;ymax+=o.ymax!=null?0:pad;
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const X=v=>pl+(v-x0)/(x1-x0||1)*w, Y=v=>pt+h-(v-ymin)/(ymax-ymin)*h;
  c.strokeStyle=css("--line");c.fillStyle=css("--dim");c.font="11px system-ui";c.lineWidth=1;
  for(let i=0;i<=4;i++){const v=ymin+(ymax-ymin)*i/4,y=Y(v);c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr,y);c.stroke();
    c.fillText(o.yfmt?o.yfmt(v):v.toFixed(Math.abs(ymax-ymin)<3?2:0),2,y+4)}
  (o.markers||[]).forEach(m=>{const x=X(m.x);c.strokeStyle="rgba(255,122,26,.35)";c.setLineDash([3,3]);
    c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+h);c.stroke();c.setLineDash([]);c.fillStyle=css("--accent");c.fillText(m.label,x+3,pt+10)});
  if(o.zero&&ymin<0&&ymax>0){c.strokeStyle=css("--dim");c.beginPath();c.moveTo(pl,Y(0));c.lineTo(W-pr,Y(0));c.stroke()}
  o.series.forEach(s=>{c.strokeStyle=s.color;c.fillStyle=s.color;c.lineWidth=s.width||1.6;
    if(s.dash)c.setLineDash(s.dash);
    if(s.dots){s.y.forEach((v,i)=>{if(v==null)return;c.beginPath();c.arc(X(xs[i]),Y(v),s.r||3,0,7);
      (s.hollow&&s.hollow[i])?c.stroke():c.fill()})}
    else{c.beginPath();let on=false;s.y.forEach((v,i)=>{if(v==null){on=false;return}
      on?c.lineTo(X(xs[i]),Y(v)):c.moveTo(X(xs[i]),Y(v));on=true});c.stroke()}
    c.setLineDash([])});
  c.fillStyle=css("--dim");
  const ticks=o.xticks||5;for(let i=0;i<=ticks;i++){const v=x0+(x1-x0)*i/ticks;c.fillText(o.xfmt?o.xfmt(v):Math.round(v),Math.min(X(v)-10,W-pr-34),H-6)}
  if(o.title){c.fillStyle=css("--text");c.fillText(o.title,pl+4,pt+10)}
}
const legend=items=>`<div class="legend">${items.map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join("")}</div>`;
function trendLine(ys){ // Theil-Sen line for display
  const p=ys.map((y,i)=>[i,y]).filter(q=>q[1]!=null),s=[];
  for(let a=0;a<p.length;a++)for(let b=a+1;b<p.length;b++)s.push((p[b][1]-p[a][1])/(p[b][0]-p[a][0]));
  if(!s.length)return ys.map(()=>null);s.sort((a,b)=>a-b);const m=s[s.length>>1];
  const ic=p.map(q=>q[1]-m*q[0]).sort((a,b)=>a-b)[p.length>>1];return ys.map((_,i)=>ic+m*i)}
function rollMed(ys,k=5){return ys.map((_,i)=>{const w=ys.slice(Math.max(0,i-k+1),i+1).filter(v=>v!=null).sort((a,b)=>a-b);return w.length?w[w.length>>1]:null})}

// ------------------------------------------------------------- shell
function tabs(){ $("#tabs").innerHTML=TABS.map(t=>`<button class="${t==tab?"on":""}" onclick="go('${t}')">${t}</button>`).join("") }
function go(t){tab=t;localStorage.setItem("tab",t);tabs();render()}
async function loadSessions(){
  const ss=(await J("/api/sessions")).filter(s=>s.laps>0&&s.track);
  $("#sess").innerHTML=ss.map(s=>`<option value="${s.id}">${s.started||""} · ${s.track} ${s.variation} · ${s.car} · ${s.type} · ${s.laps} laps · ${fmt(s.best)}</option>`).join("");
  if(!SID||!ss.find(s=>s.id==SID))SID=ss.length?ss[0].id:null;
  $("#sess").value=SID;
}
$("#sess").onchange=async e=>{SID=e.target.value;CL=null;if(tab=="Compare"){CMP.sel=[];CMP.zoom=null}await loadA();render()};
async function loadA(rebuild){A=SID?await J(`/api/analysis?sid=${encodeURIComponent(SID)}${rebuild?"&rebuild=1":""}`):null}
async function poll(){
  try{const s=await J("/api/status");$("#stat").textContent=s.status+(s.lap?` · lap ${s.lap}`:"");
    if(tab=="Live")renderLive(s);
    if(s.session&&s.session!==lastLiveSession){lastLiveSession=s.session;await loadSessions();}
    if(s.session&&s.session==SID&&s.last!==lastLast){const first=lastLast===null;lastLast=s.last;
      if(!first){await loadA();CL=null;if(tab!="Live"&&tab!="Compare")render()}}
  }catch(e){$("#stat").textContent="app not running"}
}
let lastLast=null,lastLiveSession=null;

function render(){
  const m=$("#main");
  if(tab=="Live"){m.innerHTML=liveHTML();return}
  if(tab=="Compare"||tab=="Habits"){(tab=="Compare"?rCompare:rHabits)().catch(e=>{m.innerHTML=`<div class="card bad">Could not build this view: ${e}</div>`});return}
  if(tab!="Compare"&&tab!="Habits")setHash({tab});
  if(!A||!A.laps||!A.laps.length){m.innerHTML=`<div class="card">No laps analysed yet for this session. Drive a few laps (or run <span class="mono">sim.bat</span> for a demo). Compare and Habits use every session at this track.</div>`;return}
  ({Session:rSession,Corners:rCorners,Technique:rTech,Setup:rSetup})[tab]();
}

// ------------------------------------------------------------- LIVE
function liveHTML(){return `<div class="grid">
 <div class="card"><h3>Delta to best</h3><div class="big" id="l_delta">-</div><div class="dim" id="l_ref"></div></div>
 <div class="card"><h3>Current</h3><div class="big" id="l_cur">-</div><div class="dim" id="l_lap"></div></div>
 <div class="card"><h3>Last</h3><div class="big" id="l_last">-</div></div>
 <div class="card"><h3>Best</h3><div class="big" id="l_best">-</div></div>
 <div class="card"><h3>Speed / gear</h3><div class="big" id="l_spd">-</div><div class="dim" id="l_fuel"></div></div>
</div><div class="card" style="margin-top:12px"><h3>Tyres (inner | mid | outer °C, hot pressure, carcass, brake)</h3><div class="tyre" id="l_tyres"></div></div>
<p class="dim">The Live tab is for a second screen or phone. You don't need it in VR - everything is recorded and analysed after each lap.</p>`}
function renderLive(s){
  if(!$("#l_cur"))return;
  const d=s.delta;$("#l_delta").textContent=d==null?"-":sgn(d,2);$("#l_delta").className="big "+(d==null?"":d<0?"good":"bad");
  $("#l_ref").textContent=s.ref_lap?`vs lap ${s.ref_lap}`:"";
  $("#l_cur").textContent=fmt(s.cur);$("#l_lap").textContent=s.lap?`lap ${s.lap}${s.invalid?" · INVALID":""}`:"";
  $("#l_last").textContent=fmt(s.last);$("#l_best").textContent=fmt(s.best);
  $("#l_spd").textContent=s.speed!=null?`${Math.round(s.speed)} · ${s.gear}`:"-";
  $("#l_fuel").textContent=s.fuel_l!=null?`fuel ${f(s.fuel_l,1)} L · bias ${f(s.brake_bias*100,1)}%`:"";
  if(s.tyres)$("#l_tyres").innerHTML=["FL","FR","RL","RR"].map(w=>{const t=s.tyres[w];
    return `<div class="tw"><b>${w}</b><div class="io"><span>${f(t.inner,0)}</span><span>${f(t.middle,0)}</span><span>${f(t.outer,0)}</span></div>
    <div class="mono">${f(t.pressure,2)} bar · ${f(t.carcass,0)}° · brk ${f(t.brake,0)}°</div></div>`}).join("");
}

// ------------------------------------------------------------- SESSION
function rSession(){
  const s=A.session,lt=A.lap_trend,st=A.setup||{};
  const clean=A.laps.filter(l=>l.valid&&!l.pit);
  const out=new Set(lt.outlier_laps||[]);
  $("#main").innerHTML=`
  <div class="grid">
   <div class="card"><h3>Best lap</h3><div class="big">${fmt(A.best_time)}</div><div class="dim">lap ${A.best_lap}</div></div>
   <div class="card"><h3>Theoretical (corners)</h3><div class="big">${fmt(A.theoretical_corners)}</div><div class="dim">sectors ${fmt(A.theoretical_sectors)}</div></div>
   <div class="card"><h3>Typical (median last 5)</h3><div class="big">${fmt(lt.recent_median)}</div><div class="dim">robust spread ±${f(lt.robust_sd,3)} s</div></div>
   <div class="card"><h3>Trend</h3><div class="big"><span class="pill ${lt.direction}">${lt.direction||"-"}</span></div><div class="dim">${sgn(lt.slope_per_lap)} s/lap</div></div>
   <div class="card"><h3>Focus now</h3><div><b>${st.phase=="setup"?"Setup":"Driving"}</b></div><div class="dim">${st.phase_note||""}</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Lap times · dots = laps (hollow = outlier) · line = rolling median · dashed = trend</h3>
   <canvas id="c_laps"></canvas>${legend([[css("--a"),"lap"],[css("--accent"),"rolling median (5)"],[css("--dim"),"trend"]])}</div>
  <div class="card" style="margin-top:12px"><h3>Next run</h3>${planHTML()}</div>
  <div class="card" style="margin-top:12px"><h3>Laps</h3><div class="tablewrap"><table>
   <tr><th>Lap</th><th>Run</th><th>Time</th><th>S1</th><th>S2</th><th>S3</th><th>Coast m</th><th>Lockups</th><th>Spin m</th><th>Lifts</th><th>Trail %</th><th>Top km/h</th><th>Fuel L</th><th></th></tr>
   ${A.laps.map(l=>{const t=l.technique,sc=l.sectors||[];const bs=A.best_sectors||[];
     return `<tr class="${l.lap==A.best_lap?"best":""} ${out.has(l.lap)||!l.valid||l.pit?"out":""}"><td>${l.lap}</td><td>${l.run}</td><td class="mono">${fmt(l.time)}</td>
     ${[0,1,2].map(i=>`<td class="mono ${sc[i]!=null&&sc[i]==bs[i]?"good":""}">${f(sc[i],3)}</td>`).join("")}
     <td>${f(t.coast_m,0)}</td><td>${t.lockups}</td><td>${f(t.wheelspin_m,0)}</td><td>${t.lifts}</td><td>${f(t.trail_pct,0)}</td><td>${f(t.top_speed,0)}</td><td>${f(l.fuel_used,2)}</td>
     <td class="dim">${l.pit?"pit":!l.valid?"invalid":out.has(l.lap)?"outlier":""}</td></tr>`}).join("")}
  </table></div></div>
  <div class="row" style="margin-top:12px"><button onclick="rebuild()">Re-analyse</button><button onclick="rebuild(true)">Re-detect corners</button>
   <a class="dim" href="/api/brief?sid=${encodeURIComponent(SID)}" target="_blank">brief.md</a></div>`;
  const ys=clean.map(l=>l.time);
  chart($("#c_laps"),{x:clean.map(l=>l.lap),h:220,yfmt:fmt,series:[
    {y:ys,color:css("--a"),dots:true,hollow:clean.map(l=>out.has(l.lap))},
    {y:rollMed(ys),color:css("--accent"),width:2},
    {y:trendLine(ys),color:css("--dim"),dash:[6,4]}]});
}
function planHTML(){const p=A.plan||{};return `<ol>${(p.focus||[]).map(x=>`<li><b>${x.corner}</b> <span class="dim">(${f(x.potential_s,3)} s, ${x.trend})</span> — ${x.action}</li>`).join("")}</ol>
  <div><b>One change:</b> ${p.one_change||"-"}</div>`}
async function rebuild(remap){A=await post("/api/rebuild",{sid:SID,remap:!!remap});render()}

// ------------------------------------------------------------- CORNERS
function rCorners(){
  const clean=A.laps.filter(l=>l.valid&&!l.pit);
  const tm=A.track_map||{};
  let h=`<div class="card"><h3>Track map · corners ranked by time you're leaving vs your own robust best</h3><canvas id="c_map"></canvas></div>`;
  A.corners.forEach((c,i)=>{const tr=c.trend,tm=c.typical_metrics||{},fv=c.fast_vs_slow;
    h+=`<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between">
      <div><input value="${c.name}" style="width:140px;font-weight:600" onchange="renameCorner('${c.id}',this.value)"> <span class="dim">${c.id} · apex ${Math.round(c.apex_m)} m</span></div>
      <div><span class="pill ${tr.direction}">${tr.direction||"-"} ${sgn(tr.slope_per_lap)} s/lap</span> <span class="mono">potential ${f(c.potential,3)} s</span></div></div>
      <div class="corner"><div><canvas id="c_c${i}"></canvas><div class="dim">typical ${f(c.typical,3)} · robust best ${f(c.robust_best,3)} · best ${f(c.best,3)} ${tr.outlier_laps&&tr.outlier_laps.length?`· outliers: laps ${tr.outlier_laps.join(", ")}`:""}</div></div>
      <div><table>
       ${tm.braking?`<tr><td>Brake point</td><td>${f(-tm.brake_m,0)} m before apex @ ${f(tm.brake_speed,0)} km/h</td></tr>
       <tr><td>Brake peak / ramp</td><td>${f(tm.brake_peak*100,0)}% / ${f(tm.brake_ramp_s,2)} s</td></tr>
       <tr><td>Release</td><td>${tm.release_style||"-"} · trail ${f(tm.trail_m,0)} m</td></tr>`:`<tr><td>Lift</td><td>${tm.lift_m!=null?f(-tm.lift_m,0)+" m before apex":"flat"}</td></tr>`}
       <tr><td>Min speed</td><td>${f(tm.min_speed,1)} km/h</td></tr>
       <tr><td>Throttle on / full</td><td>${f(tm.throttle_on_m,0)} / ${f(tm.full_throttle_m,0)} m after apex</td></tr>

function drawCornerMap(cv,tm){   // was drawMap(cv,tm): clashed with the Compare drawMap() and never ran

  c.strokeStyle=css("--dim");c.lineWidth=3;c.beginPath();xs.forEach((_,i)=>{const[p,q]=P(i);i?c.lineTo(p,q):c.moveTo(p,q)});c.stroke();

    c.beginPath();c.arc(p,q,r,0,7);c.fill();pl.push([p-r,q-r,p+r,q+r]);lab.push([cn,p,q,r])});

// ------------------------------------------------------------- zoomable, linked charts
// Drag across any chart to zoom (all charts in the group follow), double-click to reset,
// hover for a crosshair + values. Y axis re-scales to what is visible.
const LAPCOL=["#35c7ff","#ffab7a","#5be37d","#c792ff"];
class ZGroup{
  constructor(x){this.x=x;this.full=[x[0],x[x.length-1]];this.r=[...this.full];this.hover=null;this.charts=[];this.listeners=[]}
  set(a,b){if(b-a<20){const m=(a+b)/2;a=m-10;b=m+10}this.r=[Math.max(this.full[0],a),Math.min(this.full[1],b)];this.draw()}
  reset(){this.r=[...this.full];this.draw()}
  setHover(x){this.hover=x;this.draw(true)}
  draw(hoverOnly){this.charts.forEach(c=>c.draw());this.listeners.forEach(f=>f(hoverOnly))}
  i0(){return Math.max(0,bisect(this.x,this.r[0])-1)} i1(){return Math.min(this.x.length-1,bisect(this.x,this.r[1])+1)}
}
function bisect(a,v){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;a[m]<v?lo=m+1:hi=m}return lo}
class ZChart{
  // o: {group, h, series:[{y,color,width,dash,label}], title, yfmt, zero, ymin, ymax, markers, unit, step}
  constructor(el,o){this.o=o;this.g=o.group;this.g.charts.push(this);
    el.innerHTML=`<div class="zc"><div class="zct">${o.title||""}</div><canvas></canvas></div>`;
    this.cv=el.querySelector("canvas");this.drag=null;const cv=this.cv;
    const xAt=e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left;return this.r0+(px-this.pl)/(this.w||1)*(this.r1-this.r0)};
    cv.addEventListener("mousedown",e=>{this.drag={a:xAt(e),px:e.clientX};e.preventDefault()});
    cv.addEventListener("mousemove",e=>{const x=xAt(e);if(this.drag){this.drag.b=x;this.draw()}this.g.setHover(x)});
    cv.addEventListener("mouseleave",()=>{this.g.setHover(null)});
    addEventListener("mouseup",e=>{if(!this.drag)return;const d=this.drag;this.drag=null;
      if(d.b!=null&&Math.abs(e.clientX-d.px)>8)this.g.set(Math.min(d.a,d.b),Math.max(d.a,d.b));
      else{this.draw();if(this.o.onClick&&e.target===cv)this.o.onClick(d.a,e)}});
    cv.addEventListener("dblclick",()=>this.g.reset());
    cv.addEventListener("touchmove",e=>{const t=e.touches[0];this.g.setHover(xAt(t))},{passive:true});
    this.draw()}
  draw(){
    const o=this.o,g=this.g,cv=this.cv,dpr=devicePixelRatio||1,W=cv.clientWidth||800,H=o.h||200;
    if(cv.width!=W*dpr||cv.height!=H*dpr){cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px"}
    const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
    const pl=58,pr=12,pt=8,pb=24,w=W-pl-pr,h=H-pt-pb;this.pl=pl;this.w=w;
    const [r0,r1]=g.r;this.r0=r0;this.r1=r1;const xs=g.x,i0=g.i0(),i1=g.i1();
    let lo=Infinity,hi=-Infinity;
    o.series.forEach(s=>{for(let i=i0;i<=i1;i++){const v=s.y[i];if(v!=null&&isFinite(v)){if(v<lo)lo=v;if(v>hi)hi=v}}});
    if(o.band)for(let i=i0;i<=i1;i++){const a=o.band.lo[i],b=o.band.hi[i];if(a!=null&&a<lo)lo=a;if(b!=null&&b>hi)hi=b}
    if(o.ymin!=null)lo=o.ymin;if(o.ymax!=null)hi=o.ymax;
    if(o.zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}
    if(!isFinite(lo)){lo=0;hi=1}if(hi-lo<(o.minSpan||1e-6)){const m=(hi+lo)/2,s=(o.minSpan||1)/2;lo=m-s;hi=m+s}
    if(o.ymin==null||o.ymax==null){const p=(hi-lo)*.07;if(o.ymin==null)lo-=p;if(o.ymax==null)hi+=p}
    const X=v=>pl+(v-r0)/(r1-r0)*w,Y=v=>pt+h-(v-lo)/(hi-lo)*h;
    c.font="13px system-ui";c.lineWidth=1;
    // corner bands / markers
    (o.markers||[]).forEach(m=>{if(m.x<r0-300||m.x>r1+300)return;const x=X(m.x);
      if(m.a!=null){c.fillStyle="rgba(255,197,61,.07)";c.fillRect(X(m.a),pt,X(m.b)-X(m.a),h)}
      c.strokeStyle="rgba(255,197,61,.45)";c.setLineDash([4,4]);c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+h);c.stroke();c.setLineDash([]);
      c.fillStyle="#ffc53d";c.font="bold 13px system-ui";c.fillText(m.label,Math.min(x+4,W-pr-60),pt+14);c.font="13px system-ui"});
    // grid + y labels
    const nt=Math.max(2,Math.min(5,Math.floor(h/36)));
    for(let k=0;k<=nt;k++){const v=lo+(hi-lo)*k/nt,y=Y(v);c.strokeStyle="#2a3138";c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr,y);c.stroke();
      c.fillStyle="#9aa4ae";c.fillText(o.yfmt?o.yfmt(v):(Math.abs(hi-lo)<4?v.toFixed(2):Math.abs(hi-lo)<40?v.toFixed(1):v.toFixed(0)),4,y+4)}
    if(o.zero&&lo<0&&hi>0){c.strokeStyle="#8b949e";c.beginPath();c.moveTo(pl,Y(0));c.lineTo(W-pr,Y(0));c.stroke()}
    // x labels
    const span=r1-r0,stepx=[5,10,20,25,50,100,200,250,500,1000].find(s=>span/s<=10)||1000;
    c.fillStyle="#9aa4ae";for(let v=Math.ceil(r0/stepx)*stepx;v<=r1;v+=stepx){const x=X(v);c.fillText(Math.round(v)+" m",Math.min(x-14,W-pr-46),H-6)}
    // series
    c.save();c.beginPath();c.rect(pl,pt,w,h);c.clip();
    if(o.band){const B=o.band;c.fillStyle=B.color||"rgba(139,148,158,.18)";c.beginPath();let st=false;
      for(let i=i0;i<=i1;i++){if(B.hi[i]==null)continue;const x=X(xs[i]),y=Y(B.hi[i]);st?c.lineTo(x,y):c.moveTo(x,y);st=true}
      for(let i=i1;i>=i0;i--){if(B.lo[i]==null)continue;c.lineTo(X(xs[i]),Y(B.lo[i]))}c.closePath();c.fill()}
    (o.notes?o.notes():[]).forEach(n=>{if(n.dist<r0||n.dist>r1)return;const x=X(n.dist);c.strokeStyle=n.status=="resolved"?"rgba(57,217,138,.7)":"#c792ff";c.lineWidth=2;
      c.setLineDash([2,3]);c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+h);c.stroke();c.setLineDash([]);c.fillStyle=c.strokeStyle;c.font="bold 12px system-ui";
      const t="✎ "+(n.text.length>28?n.text.slice(0,27)+"…":n.text);c.fillText(t,Math.min(x+4,W-pr-c.measureText(t).width-4),pt+h-6);c.font="13px system-ui";c.lineWidth=1});
    const stride=Math.max(1,Math.floor((i1-i0)/(w*1.5)));
    o.series.forEach(s=>{c.strokeStyle=s.color;c.lineWidth=s.width||1.8;c.setLineDash(s.dash||[]);c.beginPath();let on=false;
      for(let i=i0;i<=i1;i+=stride){const v=s.y[i];if(v==null){on=false;continue}const x=X(xs[i]),y=Y(v);on?c.lineTo(x,y):c.moveTo(x,y);on=true}
      c.stroke()});c.setLineDash([]);
    // drag box
    if(this.drag&&this.drag.b!=null){c.fillStyle="rgba(53,199,255,.15)";const a=X(this.drag.a),b=X(this.drag.b);c.fillRect(Math.min(a,b),pt,Math.abs(b-a),h)}
    // hover
    if(g.hover!=null&&g.hover>=r0&&g.hover<=r1){const x=X(g.hover),i=Math.min(xs.length-1,bisect(xs,g.hover));
      c.strokeStyle="#e6e9ec";c.globalAlpha=.6;c.beginPath();c.moveTo(x,pt);c.lineTo(x,pt+h);c.stroke();c.globalAlpha=1;
      const vals=o.series.filter(s=>s.label!==false).map(s=>[s.color,s.y[i]]);
      let bx=x+10;const bw=78,bh=18*vals.length+6;if(bx+bw>W-pr)bx=x-10-bw;
      c.fillStyle="rgba(15,18,20,.88)";c.fillRect(bx,pt+4,bw,bh);
      vals.forEach(([col,v],k)=>{c.fillStyle=col;c.font="bold 13px ui-monospace,Consolas,monospace";
        c.fillText(v==null?"-":(o.yfmt?o.yfmt(v):(+v).toFixed(o.dp??1)),bx+6,pt+20+18*k)});c.font="13px system-ui";
      vals.forEach(([col,v])=>{if(v==null)return;c.fillStyle=col;c.beginPath();c.arc(x,Y(v),3.5,0,7);c.fill()})}
    c.restore();
  }
}

// place a map label next to point (p,q): prefer the side facing away from the map centre (cx,cy), skip spots that overlap labels already placed
function putLabel(c,t,p,q,placed,cx,cy,W,H,rad){rad=rad||4;const g=rad+3,w=c.measureText(t).width,h=12,ox=p-cx,oy=q-cy;
  const cands=[[g,4],[g*.7,-g*.7],[g*.7,g*.7+h],[-w-g,4],[-w-g*.7,-g*.7],[-w-g*.7,g*.7+h],[-w/2,-g],[-w/2,g+h],[g,-g-8],[-w-g,-g-8],[g,g+h+8],[-w-g,g+h+8]].map(d=>{const vx=d[0]+w/2,vy=d[1]-h/2,L=Math.hypot(vx,vy)||1,O=Math.hypot(ox,oy)||1;return [d,(vx*ox+vy*oy)/(L*O)-L/60]}).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);

  let pick=cands.find(([dx,dy])=>!hit(p+dx,q+dy))||cands[0];const x=p+pick[0],y=q+pick[1];placed.push([x-4,y-h-2,x+w+4,y+4]);c.fillText(t,x,y)}

function dotChart(el,o){ // simple index-based dot chart with hover
  el.innerHTML=`<canvas></canvas><div class="dim tip"></div>`;const cv=el.querySelector("canvas"),tip=el.querySelector(".tip");
  const draw=(hi)=>{const dpr=devicePixelRatio||1,W=cv.clientWidth||800,H=o.h||220;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
    const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);const pl=64,pr=12,pt=10,pb=26,w=W-pl-pr,h=H-pt-pb,n=o.y.length;
    const vs=o.y.filter(v=>v!=null);if(!vs.length){c.fillStyle="#8b949e";c.fillText("no data",pl,pt+20);return}
    let lo=Math.min(...vs),hi2=Math.max(...vs);if(hi2-lo<1e-6){lo-=1;hi2+=1}const p=(hi2-lo)*.08;lo-=p;hi2+=p;
    const X=i=>pl+(n<2?w/2:i/(n-1)*w),Y=v=>pt+h-(v-lo)/(hi2-lo)*h;c.font="13px system-ui";
    (o.bands||[]).forEach((bd,k)=>{c.fillStyle=k%2?"rgba(255,255,255,.035)":"rgba(53,199,255,.05)";const a=X(bd.a)-(n>1?w/(n-1)/2:20),b2=X(bd.b)+(n>1?w/(n-1)/2:20);c.fillRect(a,pt,b2-a,h);c.fillStyle="#9aa4ae";c.fillText(bd.label,Math.max(pl,a+4),H-6)});
    for(let k=0;k<=4;k++){const v=lo+(hi2-lo)*k/4,y=Y(v);c.strokeStyle="#2a3138";c.beginPath();c.moveTo(pl,y);c.lineTo(W-pr,y);c.stroke();c.fillStyle="#9aa4ae";c.fillText(o.yfmt?o.yfmt(v):v.toFixed(o.dp??1),4,y+4)}
    if(o.line){c.strokeStyle="#ff7a1a";c.lineWidth=2;c.beginPath();let on=false;o.line.forEach((v,i)=>{if(v==null)return;on?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v));on=true});c.stroke()}

    cv.onclick=e=>{if(o.click){const r=cv.getBoundingClientRect(),px=e.clientX-r.left;o.click(Math.max(0,Math.min(n-1,Math.round((px-pl)/(w||1)*(n-1)))))}}};

  <div class="card" style="margin-top:12px"><h3>Runs (stints) — did the change work?</h3><table><tr><th>Run</th><th>Laps</th><th>Best</th><th>Median</th><th>Δ median</th><th>Change made before this run</th></tr>
   ${(A.run_comparison||[]).map(r=>`<tr><td>${r.run}</td><td>${r.laps}</td><td>${fmt(r.best)}</td><td>${fmt(r.median)}</td><td class="${r.median_delta<0?"good":r.median_delta>0?"bad":""}">${r.median_delta!=null?sgn(r.median_delta)+(r.significant?"":" (noise)"):"-"}</td><td style="text-align:left">${r.change||""}</td></tr>`).join("")}</table>
   <div class="row" style="margin-top:8px">Log a change for run <input id="ch_run" type="number" value="${lastRun+1}" style="width:60px"> <input id="ch_txt" placeholder="e.g. brake bias 58 → 57" style="flex:1;min-width:220px"> <button onclick="logChange()">Add</button></div></div>
  <div class="card" style="margin-top:12px"><h3>Current setup sheet (${A.session.car} @ ${A.session.track}) — the game doesn't expose setup values, so type them here and advice will say "from → to"</h3>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${keys.map(k=>`<label class="dim">${k}<br><input data-k="${k}" value="${vals[k]??""}" style="width:100%"></label>`).join("")}</div>
   <div class="row" style="margin-top:8px"><input id="newkey" placeholder="add another field"><button onclick="saveSetup()">Save setup</button></div></div>`;
}
async function saveSetup(){const v={};document.querySelectorAll("[data-k]").forEach(i=>{if(i.value!==""){const n=Number(i.value);v[i.dataset.k]=isNaN(n)?i.value:n}});
  const nk=$("#newkey").value.trim();if(nk)v[nk]="";A=await post("/api/setup",{sid:SID,values:v});render()}
async function logChange(){const t=$("#ch_txt").value.trim();if(!t)return;A=await post("/api/setup",{sid:SID,change:{run:Number($("#ch_run").value),text:t,when:new Date().toISOString()}});render()}

// ------------------------------------------------------------- boot
addEventListener("hashchange",()=>{const hs=hashState();if(hs.tab&&TABS.includes(hs.tab)){if(hs.tab=="Compare"){CMP.sel=[];CMP.zoom=null}if(hs.tab!=tab||hs.tab=="Compare")go(hs.tab)}});
(async()=>{const hs=hashState();if(hs.tab&&TABS.includes(hs.tab))tab=hs.tab;
  await loadSessions();
  if(hs.laps){const sid=hs.laps.split(",")[0].split("~")[0];if([...$("#sess").options].some(o=>o.value==sid)){SID=sid;$("#sess").value=sid}}
  tabs();await loadA();render();setInterval(poll,500);
  let rt=null;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(tab=="Compare"&&CMP.group){CMP.group.draw()}else if(tab!="Live")render()},150)})})();
</script>
</body>
</html>
